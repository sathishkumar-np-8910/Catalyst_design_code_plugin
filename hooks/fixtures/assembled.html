<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/zcat-ui/zcat.css">
<style>.a-wrap{display:flex;flex-direction:column;gap:16px;padding:16px}</style></head>
<body><div class="zc-layout"><div class="zc-layout__shell"><div class="zc-layout__main">
<div class="zc-layout__page">
  <div class="zc-layout__subheader"><div class="zc-layout__subheader-title">Databases</div></div>
  <div class="zc-layout__body"><div class="zc-layout__container">
    <div class="a-wrap">
      <div class="zc-tabs" data-type="primary">
        <button class="zc-tab" data-state="active">Overview</button>
        <button class="zc-tab">Schema</button>
      </div>
      <div class="zc-gdetails"><span class="zc-body-3">Region</span><span class="zc-body-3">us-east-1</span></div>
      <div class="zc-gdetails"><span class="zc-body-3">Engine</span><span class="zc-body-3">PostgreSQL 15</span></div>
      <div class="zc-gdetails"><span class="zc-body-3">Storage</span><span class="zc-body-3">240 GB</span></div>
      <div class="zc-gdetails"><span class="zc-body-3">Backups</span><span class="zc-body-3">Daily 02:00 UTC</span></div>
      <div role="button" onclick="void 0" class="a-fake"><span class="zc-body-3">Run migration</span></div>
      <input type="text" value="search">
    </div>
  </div></div>
</div></div></div></div>
<script src="/zcat-ui/zcat.js" defer></script></body></html>
